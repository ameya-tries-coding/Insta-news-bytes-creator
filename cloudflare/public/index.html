<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121214">
<title>Fyntrest Bytes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&family=Google+Sans:wght@500;600;700&family=Merriweather:wght@700&display=swap">
<style>
  :root {
    --bg: #121214; --panel: #1b1b20; --line: #2c2c35; --fg: #f4f4f6; --muted: #a3a3b4;
    --accent: #7b7cff; --accent-2: #b057a8; --danger: #ff6b81; --warn: #d9c27a;
    --head: "Barlow Condensed", "Arial Narrow", sans-serif;
    --text: "Google Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--fg); font: 15px/1.45 var(--text);
    padding: calc(18px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(40px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  }
  main { max-width: 520px; margin: 0 auto; display: grid; gap: 16px; }
  h1 { margin: 0; font: 800 38px/1 var(--head); }
  h1 em { font-style: normal; color: var(--accent); }
  .sub { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 12px; }
  label { display: grid; gap: 5px; font-size: 13px; color: var(--muted); }
  input, textarea { width: 100%; background: #111116; color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font: inherit; font-size: 16px; }
  textarea { resize: vertical; min-height: 60px; }
  input:focus-visible, textarea:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button { font: inherit; font-weight: 600; border-radius: 12px; border: 1px solid var(--line); background: #24242c; color: var(--fg); padding: 13px 16px; cursor: pointer; }
  button:disabled { opacity: .55; cursor: default; }
  .primary { background: linear-gradient(90deg, var(--accent), var(--accent-2)); border: 0; color: #fff; }
  .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .buttons.one { grid-template-columns: 1fr; }
  .status { font-size: 14px; color: var(--muted); min-height: 1.3em; }
  .status.err { color: var(--danger); }
  .note { font-size: 13px; color: var(--warn); }
  .left { font-size: 12.5px; color: var(--muted); }
  .left.out { color: var(--warn); }
  .note:empty { display: none; }
  .stage { width: 100%; max-width: 360px; justify-self: center; aspect-ratio: 9 / 16; border-radius: 14px; overflow: hidden; box-shadow: 0 0 0 1px var(--line), 0 16px 40px rgba(0,0,0,.5); }
  .stage canvas { width: 100%; height: 100%; display: block; }
  .row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .hint { margin: 0; color: var(--muted); font-size: 13px; }
  [hidden] { display: none !important; }
  details summary { cursor: pointer; font-weight: 600; }
  .edit { display: grid; gap: 10px; margin-top: 12px; }
  .busy::after { content: ""; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  @media (prefers-reduced-motion: reduce) { .busy::after { animation: none; content: "..."; } }
  .saveview { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.88); display: grid; place-items: center; padding: 20px; }
  .saveview .box { display: grid; gap: 12px; justify-items: center; max-width: 360px; }
  .saveview img { width: 100%; max-height: 72vh; object-fit: contain; border-radius: 12px; }
  .saveview p { margin: 0; text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Fyntrest <em>Bytes</em></h1>
    <p class="sub">Paste a news link or type a topic. Get a ready-to-post story.</p>
  </header>

  <form class="card" id="form">
    <label for="query">News link or topic</label>
    <input id="query" type="text" autocomplete="off" enterkeyhint="go" placeholder="https://… or e.g. RBI repo rate">
    <div id="pwWrap" hidden style="display:grid;gap:5px">
      <label for="pw">Team password</label>
      <input id="pw" type="password" autocomplete="current-password">
    </div>
    <button class="primary" id="go" type="submit">Make story</button>
    <div class="status" id="status" role="status"></div>
    <div class="left" id="left" hidden></div>
  </form>

  <section class="card" id="result" hidden>
    <div class="stage"><canvas id="cv" width="1080" height="1920" aria-label="Story preview"></canvas></div>
    <div class="note" id="note"></div>
    <div class="buttons" id="actions">
      <button class="primary" id="share" type="button">Share</button>
      <button id="download" type="button">Download</button>
    </div>
    <details>
      <summary>Edit the words</summary>
      <div class="edit">
        <div class="row">
          <label>Tag<input id="f_tag" type="text"></label>
          <label>Source<input id="f_source" type="text"></label>
          <label>Date<input id="f_date" type="text"></label>
        </div>
        <label>Big line (wrap the highlight in *stars*)<input id="f_hook" type="text"></label>
        <label>Context<textarea id="f_body" rows="2"></textarea></label>
        <label>What it means for you<textarea id="f_take" rows="3"></textarea></label>
        <label>Website (shown with the source at the bottom)<input id="f_site" type="text"></label>
      </div>
    </details>
    <p class="hint">Check the facts against the article before posting.</p>
  </section>
</main>

<div class="saveview" id="saveview" hidden>
  <div class="box">
    <img id="saveImg" alt="Finished story">
    <p>Press and hold the image to save it.</p>
    <button type="button" id="saveClose">Close</button>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const KEYS = ["tag", "source", "date", "hook", "body", "take", "site"];
  const store = { get: k => { try { return localStorage.getItem(k) || ""; } catch { return ""; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
  let needPw = false, story = null; // story = { img: Image|null, title, note }

  function refreshConfig() {
    fetch("/api/config").then(r => r.json()).then(c => {
      needPw = c.password; $("pwWrap").hidden = !needPw; if (!$("pw").value) $("pw").value = store.get("fb-pw");
      const left = $("left");
      if (typeof c.storiesLeft === "number") {
        left.hidden = false;
        left.textContent = c.storiesLeft > 0 ? `About ${c.storiesLeft} ${c.storiesLeft === 1 ? "story" : "stories"} left today for the whole team.` : "Today's free stories are used up. More from 5:30 am IST.";
        left.className = "left" + (c.storiesLeft > 0 ? "" : " out");
      }
    }).catch(() => {});
  }
  refreshConfig();

  // ================= story drawing (same geometry as the desktop template) =================
  const W = 1080, H = 1920, ZX = 64, ZTOP = 380, ZBOT = 1385, ZW = W - ZX * 2;
  const C = { fg: "#f4f4f6", muted: "#b9b9c6", accent: "#7b7cff", accent2: "#b057a8", site: "#8a8a96", rule: "#e6e6ea" };
  const F = { head: '"Barlow Condensed", "Arial Narrow", sans-serif', text: '"Google Sans", system-ui, sans-serif', serif: 'Merriweather, Georgia, serif' };
  const cv = $("cv"), ctx = cv.getContext("2d");
  let bg = null;
  const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
  const bgReady = loadImg("/background.webp").then(i => (bg = i)).catch(() => null);
  const fontsReady = Promise.all(['800 92px "Barlow Condensed"', '600 32px "Google Sans"', '700 22px "Google Sans"', '500 21px "Google Sans"', '700 40px Merriweather']
    .map(f => document.fonts.load(f).catch(() => null)));

  function setFont(px, weight, fam, ls = 0) { ctx.font = `${weight} ${px}px ${fam}`; if ("letterSpacing" in ctx) ctx.letterSpacing = ls + "px"; }
  function wrap(text, maxW) {
    const words = text.split(/\s+/).filter(Boolean), lines = []; let line = "";
    for (const w of words) { const t = line ? line + " " + w : w; if (ctx.measureText(t).width <= maxW || !line) line = t; else { lines.push(line); line = w; } }
    if (line) lines.push(line); return lines;
  }
  function wrapRich(src, maxW) {
    // "*x*" marks the highlight; pieces with no space between them stay one word ("*resigned*.")
    const words = []; let hl = false, cur = "", word = [];
    const flush = () => { if (cur) { word.push({ w: cur, hl }); cur = ""; } };
    for (const ch of src) {
      if (ch === "*") { flush(); hl = !hl; }
      else if (/\s/.test(ch)) { flush(); if (word.length) { words.push(word); word = []; } }
      else cur += ch;
    }
    flush(); if (word.length) words.push(word);
    const space = ctx.measureText(" ").width, lines = []; let line = [], lw = 0;
    for (const wd of words) {
      const ww = wd.reduce((a, p) => a + ctx.measureText(p.w).width, 0);
      if (line.length && lw + space + ww > maxW) { lines.push(line); line = []; lw = 0; }
      lw += (line.length ? space : 0) + ww; line.push(wd);
    }
    if (line.length) lines.push(line); return lines;
  }
  function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
  const dims = im => ({ w: im.naturalWidth || im.width, h: im.naturalHeight || im.height });

  // Layout, top to bottom: tag · date, news photo (or a headline card when there is no photo),
  // big line, context, "What it means for you", and the source at the very bottom.
  function measure(v, s, gap, showBody, photoH) {
    let cardH, titleLines = null;
    if (story.img) cardH = photoH;
    else { setFont(46, 700, F.serif); titleLines = wrap(story.title || v.hook.replace(/\*/g, ""), ZW - 80); cardH = 34 + titleLines.length * 46 * 1.3 + 30; }
    setFont(92 * s, 800, F.head); const hookLines = wrapRich(v.hook || " ", ZW); const hookH = hookLines.length * 92 * s;
    setFont(32 * s, 600, F.text);
    const bodyLines = showBody && v.body ? wrap(v.body, ZW) : []; const bodyH = bodyLines.length * 32 * s * 1.42;
    const takeLines = v.take ? wrap(v.take, ZW - 34) : []; const takeH = v.take ? 6 + 22 * 1.3 + 8 + takeLines.length * 32 * s * 1.38 + 6 : 0;
    const srcH = (v.source || v.site) ? 30 : 0;
    const metaH = 46, blocks = [metaH, cardH, hookH]; if (bodyH) blocks.push(bodyH); if (takeH) blocks.push(takeH); if (srcH) blocks.push(srcH);
    const total = blocks.reduce((a, b) => a + b, 0) + gap * (blocks.length - 1);
    return { s, gap, cardH, titleLines, hookLines, hookH, bodyLines, bodyH, takeLines, takeH, srcH, metaH, total };
  }
  function fit(v) {
    // Shrink in this order: the photo (down to 360 px), the spacing, the type a little, drop the context line, then the type further.
    const zh = ZBOT - ZTOP;
    let photoH = 0;
    if (story.img) { const d = dims(story.img); photoH = Math.round(Math.min(Math.max(ZW * d.h / d.w, ZW * 0.5), ZW * 0.66)); }
    let gap = 36, s = 1, showBody = true, m = measure(v, s, gap, showBody, photoH);
    while (m.total > zh && story.img && photoH > 360) { photoH -= 10; m = measure(v, s, gap, showBody, photoH); }
    if (m.total > zh) { gap = 28; m = measure(v, s, gap, showBody, photoH); }
    while (m.total > zh && s > 0.88) { s -= 0.03; m = measure(v, s, gap, showBody, photoH); }
    if (m.total > zh && v.body) { showBody = false; s = 1; m = measure(v, s, gap, showBody, photoH); while (m.total > zh && s > 0.88) { s -= 0.03; m = measure(v, s, gap, showBody, photoH); } }
    while (m.total > zh && s > 0.72) { s -= 0.03; m = measure(v, s, gap, showBody, photoH); }
    m.fits = m.total <= zh; m.droppedBody = !showBody && !!v.body; return m;
  }
  function drawCard(m, x, y) {
    const w = ZW, h = m.cardH;
    ctx.save(); ctx.translate(x + w / 2, y + h / 2); ctx.rotate(-1.2 * Math.PI / 180); ctx.translate(-w / 2, -h / 2);
    ctx.save(); ctx.shadowColor = "rgba(0,0,0,.55)"; ctx.shadowBlur = 70; ctx.shadowOffsetY = 30; rrect(0, 0, w, h, 30); ctx.fillStyle = story.img ? "#222" : "#fff"; ctx.fill(); ctx.restore();
    ctx.save(); rrect(0, 0, w, h, 30); ctx.clip();
    if (story.img) {
      // cover-crop, keeping the upper-middle of the photo (where faces and logos usually are)
      const d = dims(story.img), sc = Math.max(w / d.w, h / d.h), dw = d.w * sc, dh = d.h * sc;
      ctx.drawImage(story.img, (w - dw) / 2, (h - dh) * 0.4, dw, dh);
    } else {
      setFont(46, 700, F.serif); ctx.fillStyle = "#111";
      m.titleLines.forEach((l, i) => ctx.fillText(l, 40, 34 + (i + 0.8) * 46 * 1.3));
    }
    ctx.restore();
    rrect(0, 0, w, h, 30); ctx.lineWidth = 2; ctx.strokeStyle = "rgba(123,124,255,.35)"; ctx.stroke();
    ctx.restore();
  }
  function values() { const v = {}; KEYS.forEach(k => v[k] = $("f_" + k).value.trim()); return v; }
  function draw() {
    if (!story) return;
    const v = values();
    ctx.clearRect(0, 0, W, H); ctx.fillStyle = "#121212"; ctx.fillRect(0, 0, W, H);
    if (bg) ctx.drawImage(bg, 0, 0, W, H);
    const m = fit(v); let y = ZTOP + Math.max(0, (ZBOT - ZTOP - m.total) / 2);
    ctx.textBaseline = "alphabetic";
    setFont(22, 700, F.text, 2.6); const tag = (v.tag || "News").toUpperCase(); const tw = ctx.measureText(tag).width + 36;
    const pg = ctx.createLinearGradient(ZX, 0, ZX + tw, 0); pg.addColorStop(0, C.accent); pg.addColorStop(1, C.accent2);
    rrect(ZX, y + 2, tw, 42, 21); ctx.fillStyle = pg; ctx.fill(); ctx.fillStyle = "#fff"; ctx.fillText(tag, ZX + 18, y + 31);
    setFont(25, 700, F.text, 3); ctx.fillStyle = C.muted; ctx.fillText((v.date || "").toUpperCase(), ZX + tw + 16, y + 32);
    y += m.metaH + m.gap;
    drawCard(m, ZX, y); y += m.cardH + m.gap;
    setFont(92 * m.s, 800, F.head); const sp = ctx.measureText(" ").width;
    m.hookLines.forEach((line, i) => {
      let x = ZX; const by = y + (i + 0.82) * 92 * m.s;
      line.forEach(wd => { wd.forEach(p => { ctx.fillStyle = p.hl ? C.accent : C.fg; ctx.fillText(p.w, x, by); x += ctx.measureText(p.w).width; }); x += sp; });
    });
    y += m.hookH;
    if (m.bodyH) { y += m.gap; setFont(32 * m.s, 600, F.text); ctx.fillStyle = C.muted; const lh = 32 * m.s * 1.42; m.bodyLines.forEach((l, i) => ctx.fillText(l, ZX, y + i * lh + lh * 0.76)); y += m.bodyH; }
    if (m.takeH) {
      y += m.gap; ctx.fillStyle = C.accent; ctx.fillRect(ZX, y, 8, m.takeH);
      setFont(22, 700, F.text, 3.5); ctx.fillText("WHAT IT MEANS FOR YOU", ZX + 34, y + 28);
      setFont(32 * m.s, 600, F.text); ctx.fillStyle = C.fg; const lh = 32 * m.s * 1.38, top = y + 6 + 22 * 1.3 + 8;
      m.takeLines.forEach((l, i) => ctx.fillText(l, ZX + 34, top + i * lh + lh * 0.76));
      y += m.takeH;
    }
    if (m.srcH) {
      // Source, below the whole story
      y += m.gap;
      const label = "SOURCE", name = [v.source, v.site].filter(Boolean).join(" · ");
      setFont(20, 700, F.text, 3); ctx.fillStyle = C.accent; ctx.fillText(label, ZX, y + 23);
      const lw = ctx.measureText(label).width + 16;
      setFont(24, 500, F.text, 0.3); ctx.fillStyle = C.muted; ctx.fillText(name, ZX + lw, y + 23);
    }
    $("note").textContent = [story.note, !m.fits ? "Too much text for the safe area. Shorten the big line or the takeaway." : m.droppedBody ? "The context line was left out so everything fits." : ""].filter(Boolean).join(" ");
  }
  KEYS.forEach(k => $("f_" + k).addEventListener("input", () => requestAnimationFrame(draw)));

  // ================= making a story =================
  function setStatus(msg, err = false, busy = false) { const s = $("status"); s.textContent = msg; s.className = "status" + (err ? " err" : "") + (busy ? " busy" : ""); }
  $("form").addEventListener("submit", async e => {
    e.preventDefault();
    const q = $("query").value.trim();
    if (!q) { setStatus("Paste a news link or type a topic.", true); return; }
    if (needPw) store.set("fb-pw", $("pw").value);
    $("go").disabled = true; $("query").blur();
    setStatus(/^https?:\/\//i.test(q) ? "Opening the article and writing the story" : "Finding the latest news and writing the story", false, true);
    const slow = setTimeout(() => setStatus("Still working, news sites can be slow", false, true), 20000);
    try {
      const r = await fetch("/api/story", { method: "POST", headers: { "content-type": "application/json", "x-team-password": $("pw").value }, body: JSON.stringify({ query: q }) });
      const data = await r.json().catch(() => ({ error: "The server didn't answer properly. Try again." }));
      if (!r.ok) throw new Error(data.error || `Error ${r.status}`);
      await Promise.all([bgReady, fontsReady]);
      story = { img: data.image ? await loadImg(data.image).catch(() => null) : null, title: data.title, note: data.note || "" };
      KEYS.forEach(k => $("f_" + k).value = (k === "site" ? data.site : data.fields[k]) || "");
      $("result").hidden = false; draw(); setStatus("");
      $("result").scrollIntoView({ behavior: "smooth", block: "start" });
    } catch (err) { setStatus(err.message, true); }
    finally { clearTimeout(slow); $("go").disabled = false; refreshConfig(); }
  });

  // ================= saving =================
  const fileName = () => {
    const d = new Date(Date.now() + 5.5 * 3600e3).toISOString().slice(0, 10);
    let s = $("f_hook").value.replace(/\*/g, "").toLowerCase().replace(/['’]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    if (s.length > 60) s = s.slice(0, 60).replace(/-[^-]*$/, "");
    return `${d}-${s || "story"}.png`;
  };
  const pngBlob = () => new Promise(r => cv.toBlob(r, "image/png"));
  const canShareFiles = (() => { try { return !!(navigator.canShare && navigator.canShare({ files: [new File([""], "x.png", { type: "image/png" })] })); } catch { return false; } })();
  if (!canShareFiles) { $("share").hidden = true; $("actions").classList.add("one"); }
  $("share").addEventListener("click", async () => {
    try { await navigator.share({ files: [new File([await pngBlob()], fileName(), { type: "image/png" })] }); } catch {}
  });
  $("download").addEventListener("click", async () => {
    const url = URL.createObjectURL(await pngBlob());
    const a = document.createElement("a"); a.href = url; a.download = fileName(); document.body.appendChild(a); a.click(); a.remove();
    // In-app browsers (Instagram, WhatsApp) ignore downloads: show the image to press-and-hold instead.
    if (/Instagram|FBAN|FBAV|WhatsApp|wv\)/i.test(navigator.userAgent)) { $("saveImg").src = url; $("saveview").hidden = false; }
  });
  $("saveClose").addEventListener("click", () => { $("saveview").hidden = true; });
})();
</script>
</body>
</html>
